<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aero — LeiaNET</title>
<meta name="description" content="Escribí con el teclado y mirá cómo tu texto se vuelve puro Frutiger Aero: vidrio, burbujas y brillo.">
<link rel="icon" href="assets/favicon.png">
<style>
:root{--blue:#1e90e6;--cyan:#6fe3ff;--green:#7ddc3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI","Frutiger","Trebuchet MS",Verdana,sans-serif;overflow:hidden;color:#fff;
 background:linear-gradient(180deg,#2a8fe8 0%,#6ac6ff 35%,#c9f0ff 62%,#e8fbff 70%);position:relative}
/* sky glow */
body:before{content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(ellipse 60% 40% at 25% 18%,rgba(255,255,255,.75),transparent 70%),
 radial-gradient(ellipse 50% 30% at 80% 25%,rgba(255,255,255,.5),transparent 70%)}
/* hills */
.hill{position:fixed;left:-10%;width:120%;border-radius:50% 50% 0 0/100% 100% 0 0;pointer-events:none}
.h1{bottom:-12vh;height:38vh;background:radial-gradient(ellipse at 50% 0,#b6ff6a,#4fb81f 70%);box-shadow:inset 0 14px 30px rgba(255,255,255,.5)}
.h2{bottom:-18vh;left:-30%;width:100%;height:34vh;background:radial-gradient(ellipse at 50% 0,#8bf04a,#2f9a14 75%);opacity:.95}
.h3{bottom:-22vh;left:30%;width:90%;height:34vh;background:radial-gradient(ellipse at 50% 0,#a6ff5c,#3aa51a 75%)}
/* bubbles */
.bubble{position:fixed;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 22%,rgba(120,220,255,.12) 60%,rgba(255,255,255,.55) 100%);
 border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 -6px 14px rgba(0,160,255,.25),0 4px 14px rgba(0,110,200,.2)}
.bg-bubble{animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0) translateX(0)}to{transform:translateY(-130vh) translateX(var(--dx,20px))}}
.pop{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
/* top bar */
.top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:6px;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.9);
 box-shadow:0 6px 20px rgba(0,90,170,.3),inset 0 1px 0 #fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn{font:600 14px "Segoe UI",sans-serif;color:#064a8a;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.9);
 padding:8px 18px;border-radius:999px;text-shadow:0 1px 0 rgba(255,255,255,.8);
 background:linear-gradient(180deg,#fff 0%,#cdeeff 48%,#9edcff 52%,#d9f6ff 100%);box-shadow:0 2px 6px rgba(0,90,170,.3),inset 0 1px 0 #fff}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
/* window */
.win{position:fixed;z-index:3;left:50%;top:52%;transform:translate(-50%,-50%);width:min(900px,92vw);height:min(520px,66vh);
 border-radius:18px;padding:10px;
 background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(160,225,255,.28));
 border:1px solid rgba(255,255,255,.95);
 box-shadow:0 20px 60px rgba(0,80,160,.4),inset 0 1px 0 #fff,inset 0 0 40px rgba(255,255,255,.35);
 backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);display:flex;flex-direction:column}
.win:before{content:"";position:absolute;left:0;right:0;top:0;height:46%;border-radius:18px 18px 60% 60%/18px 18px 30px 30px;
 background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.bar{position:relative;display:flex;align-items:center;gap:10px;padding:4px 10px 10px;color:#05467f;font-weight:600;text-shadow:0 1px 0 #fff}
.dots{margin-left:auto;display:flex;gap:6px}
.dots i{width:26px;height:16px;border-radius:8px;border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(0,60,120,.4)}
.dots i:nth-child(1){background:linear-gradient(#e8f6ff,#8ccaf0)}.dots i:nth-child(2){background:linear-gradient(#e8f6ff,#8ccaf0)}
.dots i:nth-child(3){background:linear-gradient(#ffb0a0,#e0301a);width:38px}
.screen{position:relative;flex:1;border-radius:10px;overflow:auto;padding:22px 26px;
 background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(225,247,255,.8));
 box-shadow:inset 0 2px 10px rgba(0,100,180,.3);cursor:text;outline:none}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
 color:#5aa9dc;font-size:clamp(20px,3.4vw,34px);font-weight:300;letter-spacing:.5px;pointer-events:none;transition:opacity .3s}
.hint b{font-weight:600;color:#2a8fe8}
.has-text .hint{opacity:0}
#out{position:relative;font-size:clamp(34px,6.4vw,72px);font-weight:800;line-height:1.15;word-break:break-word;min-height:1em}
.ch{display:inline-block;white-space:pre;color:transparent;
 background:linear-gradient(180deg,hsl(var(--h),100%,78%) 0%,hsl(var(--h),95%,52%) 48%,hsl(calc(var(--h) + 20),100%,38%) 52%,hsl(calc(var(--h) + 30),100%,66%) 100%);
 -webkit-background-clip:text;background-clip:text;
 filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 4px 5px rgba(0,80,150,.45));
 animation:drop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{transform:translateY(-30px) scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.caret{display:inline-block;width:6px;height:.85em;margin-left:3px;vertical-align:-.08em;border-radius:3px;
 background:linear-gradient(180deg,#fff,#4fc3ff 50%,#1e90e6);box-shadow:0 0 10px #6fe3ff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tools{position:relative;display:flex;gap:10px;justify-content:center;padding-top:12px;flex-wrap:wrap}
.foot{position:fixed;bottom:8px;left:0;right:0;text-align:center;z-index:4;font-size:12px;color:#064a8a;text-shadow:0 1px 0 rgba(255,255,255,.8)}
#kb{position:fixed;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){.bg-bubble{animation:none}.ch,.pop{animation:none}}
</style>
</head>
<body>
<div class="hill h2"></div><div class="hill h3"></div><div class="hill h1"></div>
<div id="bg"></div>

<div class="top">
  <a class="btn" href="index.html">← Inicio</a>
  <a class="btn" href="utilidades.html">Utilidades</a>
</div>

<div class="win" id="win">
  <div class="bar">✦ Aero Writer<div class="dots"><i></i><i></i><i></i></div></div>
  <div class="screen" id="screen" tabindex="0" aria-label="Escribí con el teclado">
    <div class="hint" id="hint"><div>Escribí con el <b>teclado</b><br>y mirá la magia ✨</div></div>
    <div id="out"><span class="caret" id="caret"></span></div>
  </div>
  <div class="tools">
    <button class="btn" id="clear">Borrar todo</button>
    <button class="btn" id="burst">Más burbujas 🫧</button>
  </div>
</div>
<input id="kb" autocomplete="off" autocapitalize="off" aria-hidden="true" tabindex="-1">
<div class="foot">LeiaNET · Aero · hecho con burbujas y mucho brillo</div>

<script>
(function(){
  var out=document.getElementById('out'),caret=document.getElementById('caret'),
      win=document.getElementById('win'),screen=document.getElementById('screen'),
      kb=document.getElementById('kb'),bg=document.getElementById('bg');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var hue=190,count=0;

  function rand(a,b){return a+Math.random()*(b-a)}

  // ambient bubbles
  for(var i=0;i<(reduce?0:16);i++){
    var b=document.createElement('div'),s=rand(20,90);
    b.className='bubble bg-bubble';
    b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+rand(0,100)+'vw;top:'+rand(100,125)+'vh;--dx:'+rand(-60,60)+'px;animation-duration:'+rand(14,32)+'s;animation-delay:'+(-rand(0,30))+'s';
    bg.appendChild(b);
  }

  function burst(x,y,n){
    for(var i=0;i<n;i++){
      var b=document.createElement('div'),s=rand(14,48);
      b.className='bubble pop';
      b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;--dx:'+rand(-140,140)+'px;--dy:'+rand(-220,-60)+'px;z-index:4';
      document.body.appendChild(b);
      (function(el){setTimeout(function(){el.remove()},1700)})(b);
    }
  }
  function caretPos(){
    var r=caret.getBoundingClientRect();return {x:r.left,y:r.top+r.height/2};
  }

  function addChar(c){
    hue=(hue+17)%360;
    var s=document.createElement('span');
    s.className='ch';s.textContent=c;s.style.setProperty('--h',hue);
    out.insertBefore(s,caret);count++;
    document.body.classList.add('has-text');win.classList.add('has-text');
    screen.scrollTop=screen.scrollHeight;
    var p=caretPos();burst(p.x,p.y,reduce?0:3);
  }
  function addBreak(){out.insertBefore(document.createElement('br'),caret);}
  function del(){
    var prev=caret.previousSibling;
    if(prev){prev.remove();var p=caretPos();burst(p.x,p.y,reduce?0:2)}
    if(out.childNodes.length<=1)win.classList.remove('has-text');
  }
  function clearAll(){
    while(out.firstChild!==caret)out.firstChild.remove();
    win.classList.remove('has-text');
  }

  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Backspace'){e.preventDefault();del();return}
    if(e.key==='Enter'){e.preventDefault();addBreak();return}
    if(e.key.length===1){e.preventDefault();addChar(e.key)}
  });
  // mobile: abre el teclado al tocar
  screen.addEventListener('click',function(){kb.focus()});
  kb.addEventListener('input',function(){
    var v=kb.value;kb.value='';
    for(var i=0;i<v.length;i++)addChar(v[i]);
  });
  kb.addEventListener('keydown',function(e){if(e.key==='Backspace'){e.preventDefault();del()}if(e.key==='Enter'){e.preventDefault();addBreak()}});
  document.getElementById('clear').onclick=clearAll;
  document.getElementById('burst').onclick=function(){
    var w=innerWidth,h=innerHeight;
    for(var i=0;i<8;i++)burst(rand(w*.15,w*.85),rand(h*.4,h*.9),3);
  };
})();
</script>
</body>
</html>
